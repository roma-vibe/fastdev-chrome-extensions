schema = 1
id = "chrome-extensions"
name = "Chrome Extensions"
description = "An npm workspace for several Chrome extensions (Manifest V3, Vue 3, Tailwind CSS 4, TypeScript) that share one node_modules and one package-lock.json. The included template extension opens in the side panel or as a popup and has a service worker, Pinia stores, services over chrome.storage.local, a manifest generated from its own .env, a Notes example with tests and a zero-warning quality gate (ESLint, Prettier, vue-tsc, Vitest). `npm run new -- \"Name\"` copies it into a new extension; Dev rebuilds every extension for Load unpacked in Chrome, and Package zips them for the Chrome Web Store."
category = "web"
languages = ["node"]
tags = [
  "chrome",
  "extension",
  "chrome-extension",
  "manifest-v3",
  "side-panel",
  "vue",
  "tailwind",
  "typescript",
  "pinia",
  "vite",
  "workspace",
  "monorepo",
]
stack = [
  "Node.js 24+ (npm workspaces)",
  "Chrome Manifest V3 (Chrome 141+)",
  "Vue 3.5",
  "Vite 8",
  "Pinia 4",
  "Vue Router 5",
  "Tailwind CSS 4",
  "Font Awesome 7",
  "TypeScript 6.0",
  "Vitest 5 + jsdom",
  "ESLint 10 + Prettier 3",
]

[requirements]
node = ">=24"
npm = ">=10"
zip = ">=3"        # npm run package
chrome = ">=141"   # loading the extensions (chrome.sidePanel.close needs 141)

# The workspace name; every extension has its own .env (VITE_EXTENSION_NAME, …).
[env]
APP_NAME = "{{ project.name }}"

[[set]]
file = "package.json"
path = ["name"]
value = "{{ project.slug }}"

[[set]]
file = "package-lock.json"
path = ["name"]
value = "{{ project.slug }}"

[[set]]
file = "package-lock.json"
path = ["packages", "", "name"]
value = "{{ project.slug }}"

[[setup]]
label = "Install dependencies"
run = "npm install"

[commands.dev]
label = "Dev"
description = "Rebuilds every extension into its dist/ folder on each change; reload the extension on chrome://extensions after a rebuild."
run = "npm run dev"
long = true
primary = true

[commands.build]
label = "Build"
run = "npm run build"

[commands.test]
label = "Test"
run = "npm test"

[commands.check]
label = "Check"
run = "npm run check"

[commands.package]
label = "Package"
description = "Builds every extension and zips its dist/ folder into extension.zip for the Chrome Web Store."
run = "npm run package"

[commands.format]
label = "Format"
description = "Formats all files with Prettier."
run = "npm run format"

# npm run new: copies template-extension/ into a new extension folder and links it with npm install.
[commands.new]
label = "New extension"
description = "Creates a new extension from template-extension/ and links it into the workspace."
run = 'npm run new -- "$NAME" --folder="$FOLDER"'
inputs = [
  { name = "NAME", label = "Extension name", placeholder = "Tab Organizer" },
  { name = "FOLDER", label = "Folder (optional)", placeholder = "tab-organizer", optional = true },
]

[verify]
commands = ["check", "build"]

# Chrome loads extensions from disk, so the preview is a build of the template extension.
[preview]
command = "build"
path = "template-extension/dist"
message = "The template extension is built. Open chrome://extensions, turn on Developer mode, click Load unpacked and select the dist folder shown here. Then click the extension's toolbar button: it opens in the side panel with the Notes example; the ⇄ button in its header switches to a popup."

[updates]
ecosystem = "npm"
# typescript-eslint 8 supports TypeScript < 6.1; @types/node follows the Node.js 24 baseline.
hold = { typescript = "<6.1", "@types/node" = "24" }

